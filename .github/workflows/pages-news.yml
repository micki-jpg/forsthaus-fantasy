name: App und Show-News aktualisieren

on:
  push:
    branches: [main]
    paths:
      - index.html
      - anmeldung.html
      - news.json
      - assets/**
      - tools/update_news.py
      - .github/workflows/pages-news.yml
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: Show-News abrufen
        run: python3 tools/update_news.py --output news.json --embed index.html
      - name: Website vorbereiten
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target = Path('_site')
          target.mkdir(exist_ok=True)
          for name in ['index.html', 'anmeldung.html', 'news.json']:
              source = Path(name)
              if not source.is_file():
                  raise SystemExit(f'Required website file missing: {name}')
              shutil.copy2(source, target / name)
          shutil.copytree('assets', target / 'assets', dirs_exist_ok=True)
          PY
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

